name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install lint dependencies
        run: uv pip install --system ruff black

      - name: Run ruff
        run: ruff check pkasolver/

      - name: Run black (check only)
        run: black --check pkasolver/

  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: System info
        run: uname -a && df -h

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install PyTorch (CPU)
        run: |
          uv pip install --system \
            torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install torch-geometric and sparse deps
        run: |
          uv pip install --system \
            torch-geometric torch-scatter torch-sparse \
            --find-links https://data.pyg.org/whl/torch-2.2.0+cpu.html

      - name: Install package and test dependencies
        run: |
          uv pip install --system ".[dev]" --no-deps
          uv pip install --system \
            rdkit numpy scipy matplotlib tqdm svgutils cairosvg molvs click

      - name: List installed packages
        run: uv pip list --system

      - name: Run tests (single-model subset for speed)
        env:
          CI: "true"
        run: |
          pytest -v --tb=short --num-models 1 \
            --cov=pkasolver --cov-report=xml \
            pkasolver/tests/test_smoke.py \
            pkasolver/tests/test_pkasolver.py \
            pkasolver/tests/test_chem.py \
            pkasolver/tests/test_data_generation.py \
            pkasolver/tests/test_ml.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
